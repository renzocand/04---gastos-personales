<div class="min-h-dvh bg-slate-50 text-slate-900 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/85 backdrop-blur">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3 sm:px-6">
      <a routerLink="/dashboard" class="flex items-center gap-2.5">
        <span
          class="flex size-9 items-center justify-center rounded-xl bg-violet-600 text-white shadow-sm"
          aria-hidden="true"
        >
          <lucide-angular [img]="ReceiptIcon" class="size-4"></lucide-angular>
        </span>
        <span class="text-base font-semibold tracking-tight">{{ 'nav.brand' | transloco }}</span>
      </a>

      <div class="flex items-center gap-2 sm:gap-3">
        <a
          routerLink="/expenses/new"
          class="inline-flex items-center gap-1.5 rounded-lg bg-violet-600 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-violet-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:ring-offset-2"
        >
          <lucide-angular [img]="PlusIcon" class="size-4"></lucide-angular>
          <span class="hidden sm:inline">{{ 'nav.newExpense' | transloco }}</span>
          <span class="sr-only sm:hidden">{{ 'nav.newExpense' | transloco }}</span>
        </a>

        <ui-language-selector />

        @if (user(); as currentUser) {
          <span class="hidden text-sm font-medium text-slate-600 sm:inline">
            {{ 'nav.greeting' | transloco: { name: currentUser.firstName } }}
          </span>
        }

        <button
          type="button"
          (click)="logout()"
          class="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:ring-offset-2"
        >
          <lucide-angular [img]="LogOutIcon" class="size-4"></lucide-angular>
          <span class="hidden sm:inline">{{ 'nav.logout' | transloco }}</span>
          <span class="sr-only sm:hidden">{{ 'nav.logoutFull' | transloco }}</span>
        </button>
      </div>
    </div>

    <nav class="mx-auto flex max-w-5xl gap-1 px-4 sm:px-6" [attr.aria-label]="'nav.sections' | transloco">
      <a
        routerLink="/dashboard"
        routerLinkActive="border-violet-600 text-violet-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2 border-b-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:text-slate-900"
      >
        <lucide-angular [img]="DashboardIcon" class="size-4"></lucide-angular>
        <span>{{ 'nav.dashboard' | transloco }}</span>
      </a>
      <a
        routerLink="/expenses"
        routerLinkActive="border-violet-600 text-violet-700"
        class="flex items-center gap-2 border-b-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:text-slate-900"
      >
        <lucide-angular [img]="ReceiptIcon" class="size-4"></lucide-angular>
        <span>{{ 'nav.expenses' | transloco }}</span>
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="border-violet-600 text-violet-700"
        class="flex items-center gap-2 border-b-2 border-transparent px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:text-slate-900"
      >
        <lucide-angular [img]="SettingsIcon" class="size-4"></lucide-angular>
        <span>{{ 'nav.settings' | transloco }}</span>
      </a>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 sm:py-8">
    <router-outlet />
  </main>

  <ui-toast-container [toasts]="toast.toasts()" (dismiss)="toast.dismiss($event)" />
</div>
