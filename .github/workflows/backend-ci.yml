name: Backend CI - Spring Boot

on:
  push:
    branches: [ "feat/backend" ]
  pull_request:
    branches: [ "feat/backend" ]

jobs:
  build-and-test:
    name: Compilación y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el código del repositorio en el runner de GitHub
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Java 17 con cache para Maven
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: 'backend/pom.xml'

    # 3. Compilar el proyecto y ejecutar la suite de pruebas usando el Maven global
    - name: Compilar y Ejecutar Pruebas con Maven
      working-directory: ./backend
      run: mvn clean verify

    # 4. Mostrar de forma clara y visual el resultado en los logs
    - name: Reportar Estado del Pipeline
      if: always()
      run: |
        echo "========================================================="
        echo "   EL RESULTADO DEL PIPELINE ES: ${{ job.status }}       "
        echo "========================================================="
