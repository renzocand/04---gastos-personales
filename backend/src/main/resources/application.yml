spring:
  application:
    name: gastos-backend

  datasource:
    url: jdbc:mysql://localhost:3307/gastos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8
    username: gastos
    password: gastos
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Hibernate crea/actualiza el esquema a partir de las entidades.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    # Permite que data.sql se ejecute DESPUÉS de que Hibernate cree las tablas.
    defer-datasource-initialization: true

  sql:
    init:
      # Ejecuta siempre data.sql (seed de categorías).
      mode: always
      # Leer data.sql como UTF-8 (si no, las tildes se corrompen en Windows).
      encoding: UTF-8

server:
  port: 8080

# Configuración de JWT. En producción, sobreescribir el secret con la variable
# de entorno APP_JWT_SECRET (debe tener al menos 32 caracteres para HS256).
app:
  jwt:
    secret: ${APP_JWT_SECRET:gastos-personales-clave-secreta-de-desarrollo-cambiar-en-produccion}
    # Vigencia del token en milisegundos (24 horas).
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    # Orígenes permitidos (CSV). En local: el dev server de Angular. En Docker
    # con nginx (mismo origen) no se usa, pero se deja configurable por entorno.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
